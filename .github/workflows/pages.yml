# Publication de la web map sur GitHub Pages.
#
# Le dépôt a pour racine le dossier du site : aucun build n'est nécessaire,
# les fichiers sont publiés tels quels. Le workflow active lui-même Pages
# (enablement: true) : aucune manipulation dans les réglages n'est requise.
#
# Url publiée : https://<compte>.github.io/<depot>/

name: Déployer la web map sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# un seul déploiement à la fois
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploiement:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Écarter l'historique Git de l'artefact publié
        run: rm -rf .git

      - name: Activer et préparer Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assembler l'artefact du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publier
        id: publication
        uses: actions/deploy-pages@v4
